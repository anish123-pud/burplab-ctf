{% extends "base.html" %}

{% block title %}Login — BurpLab CTF{% endblock %}

{% block content %}
    <div class="auth-wrap">
        <section class="auth-panel">
            <header class="auth-panel__header">
                <p class="page-kicker">Student session</p>
                <h1>Login</h1>
                <p>Authenticate to continue your local training session.</p>
            </header>
            <div class="auth-panel__body">
                <form class="form-grid" method="post" action="{{ url_for('main.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" value="{{ username|default('') }}" maxlength="32" autocomplete="username" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
                    </div>
                    <button type="submit">Log in</button>
                </form>
            </div>
            <footer class="auth-panel__footer">
                Need an account? <a href="{{ url_for('main.register') }}">Register</a>
            </footer>
        </section>
    </div>
{% endblock %}
