{% extends "base.html" %}

{% block title %}Register — BurpLab CTF{% endblock %}

{% block content %}
    <div class="auth-wrap">
        <section class="auth-panel">
            <header class="auth-panel__header">
                <p class="page-kicker">New student account</p>
                <h1>Register</h1>
                <p>Create an account using fictional training data.</p>
            </header>
            <div class="auth-panel__body">
                <form class="form-grid" method="post" action="{{ url_for('main.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" value="{{ username|default('') }}" minlength="3" maxlength="32" pattern="[a-z0-9_]+" autocomplete="username" required>
                        <p class="field-help">Lowercase letters, numbers, and underscores.</p>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" value="{{ email|default('') }}" maxlength="254" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
                        <p class="field-help">Use at least 12 characters.</p>
                    </div>
                    <button type="submit">Create account</button>
                </form>
            </div>
            <footer class="auth-panel__footer">
                Already registered? <a href="{{ url_for('main.login') }}">Login</a>
            </footer>
        </section>
    </div>
{% endblock %}
